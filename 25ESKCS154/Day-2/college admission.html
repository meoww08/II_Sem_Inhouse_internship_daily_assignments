<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <form class="admission-form">

        <h2>College Admission Form</h2>

        <!-- Student Information -->
        <h3>Student Information</h3>

        <div class="row">
            <div class="input-box">
                <label>First Name</label>
                <input type="text" placeholder="Enter First Name" required>
            </div>

            <div class="input-box">
                <label>Last Name</label>
                <input type="text" placeholder="Enter Last Name" required>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Date of Birth</label>
                <input type="date" required>
            </div>

            <div class="input-box">
                <label>Gender</label>
                <select required>
                    <option>Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Email</label>
                <input type="email" placeholder="Enter Email">
            </div>

            <div class="input-box">
                <label>Mobile Number</label>
                <input type="tel" placeholder="Enter Mobile Number">
            </div>
        </div>

        <!-- Parent Information -->
        <h3>Parent Information</h3>

        <div class="row">
            <div class="input-box">
                <label>Father's Name</label>
                <input type="text" placeholder="Father's Name">
            </div>

            <div class="input-box">
                <label>Mother's Name</label>
                <input type="text" placeholder="Mother's Name">
            </div>
        </div>

        <!-- Address -->
        <h3>Address</h3>

        <div class="input-box">
            <label>Address</label>
            <textarea placeholder="Enter Full Address"></textarea>
        </div>

        <div class="row">
            <div class="input-box">
                <label>City</label>
                <input type="text">
            </div>

            <div class="input-box">
                <label>State</label>
                <input type="text">
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>Pin Code</label>
                <input type="number">
            </div>

            <div class="input-box">
                <label>Country</label>
                <input type="text">
            </div>
        </div>

        <!-- Academic Information -->
        <h3>Academic Information</h3>

        <div class="row">
            <div class="input-box">
                <label>Course</label>
                <select>
                    <option>Select Course</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>BBA</option>
                    <option>B.Com</option>
                    <option>B.Sc</option>
                </select>
            </div>

            <div class="input-box">
                <label>Department</label>
                <select>
                    <option>Select Department</option>
                    <option>Computer Science</option>
                    <option>Cyber Security</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                    <option>Electrical</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-box">
                <label>10th Percentage</label>
                <input type="number" step="0.01">
            </div>

            <div class="input-box">
                <label>12th Percentage</label>
                <input type="number" step="0.01">
            </div>
        </div>

        <!-- Documents -->
        <h3>Upload Documents</h3>

        <div class="input-box">
            <label>Passport Size Photo</label>
            <input type="file">
        </div>

        <div class="input-box">
            <label>10th Marksheet</label>
            <input type="file">
        </div>

        <div class="input-box">
            <label>12th Marksheet</label>
            <input type="file">
        </div>

        <div class="input-box">
            <label>Aadhar Card</label>
            <input type="file">
        </div>

        <button type="submit">Submit Admission Form</button>

    </form>
</div>

</body>
</html> <!-- Ishita Agarwal -->
